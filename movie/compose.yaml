services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: umcine_db
      MYSQL_USER: movie
      MYSQL_PASSWORD: local-movie-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - movie-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/umcine_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: movie
      SPRING_DATASOURCE_PASSWORD: local-movie-password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: local-only-jwt-secret-key-32-bytes-minimum
      JWT_ACCESS_EXPIRATION: 3600
    ports:
      - "${APP_PORT:-8081}:8080"

volumes:
  movie-db-data:
